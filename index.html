<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SoleSmith - Inventory & Player Market</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--ink:#1b1626;--ink2:#2a2338;--paper:#efece6;--coral:#ff5a36;--line:#3a3150;--mut:#a79fba}
*{box-sizing:border-box;margin:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--ink);color:#fff;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 28px;gap:12px;flex-wrap:wrap}
.logo{font-family:Syne,sans-serif;font-weight:800;font-size:26px;letter-spacing:-.5px}
.logo b{color:var(--coral)}
.who{display:flex;gap:10px;align-items:center;font-weight:600}
.tabs{display:flex;gap:8px;padding:18px 28px;max-width:1250px;margin:auto}
.tab{background:transparent;border:1px solid var(--line);color:#fff;padding:10px 20px;border-radius:99px;font:700 14px Inter;cursor:pointer;text-decoration:none}
.tab.on{background:#fff;color:var(--ink)}
.locker{max-width:1250px;margin:0 auto;padding:0 28px 60px}
.locker h2{font:800 24px Syne;margin-bottom:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.card{background:var(--ink2);border-radius:20px;padding:12px;position:relative;border:1px solid transparent}
.card:hover{border-color:var(--coral)}
.card .pic{background:var(--paper);border-radius:14px;padding:8px}
.card p{font-weight:600;margin:10px 4px 0;font-size:14px}
.card small{color:var(--mut);margin:0 4px;display:block}
.empty{color:var(--mut)}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#fff;color:var(--ink);padding:12px 20px;border-radius:14px;font-weight:600;transition:transform .3s;z-index:9}
#toast.show{transform:translateX(-50%)}
.btn{padding:10px 16px;border-radius:12px;border:0;font:700 13px Inter;cursor:pointer;background:var(--line);color:#fff}
.btn.pri{background:var(--coral)}
.row{display:flex;gap:8px;margin-top:10px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:10}
.ov.on{display:flex}
.imp{background:var(--ink2);border-radius:20px;padding:28px;max-width:420px;width:100%;position:relative;border:1px solid var(--line)}
.imp input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;margin:8px 0 14px;font:inherit;background:var(--ink);color:#fff}
@media(max-width:860px){.locker{padding:0 16px 50px}}
</style>
</head>
<body>
<header>
  <div class="logo">Sole<b>Smith</b></div>
  <div class="who"><span id="coins"></span><button class="btn pri" id="auth-btn">Sign in</button></div>
</header>
<div class="tabs">
  <button class="tab on" data-v="inv">My inventory</button>
  <button class="tab" data-v="mkt">Player market</button>
  <a class="tab" href="https://mohamednaser2143-sudo.github.io/solex/">Shop at SoleX</a>
</div>

<section class="locker view" id="v-inv">
  <h2>My inventory</h2>
  <p class="empty" id="invmsg"></p>
  <div class="cards" id="inv"></div>
</section>

<section class="locker view" id="v-mkt" hidden>
  <h2>Player market</h2>
  <p class="empty" id="mktmsg"></p>
  <div class="cards" id="mkt"></div>
</section>

<div class="ov" id="auth-ov">
  <div class="imp">
    <button class="btn" id="auth-x" style="position:absolute;right:18px;top:18px;width:30px;height:30px;padding:0">&times;</button>
    <h2 id="auth-title" style="font-family:Syne;margin-bottom:6px">Sign In</h2>
    <p style="color:var(--mut);font-size:13px;margin-bottom:14px">Sign in to sync your inventory and player market.</p>
    <label style="font-size:12px;font-weight:600">Email</label>
    <input type="email" id="email-in" placeholder="player@example.com">
    <label style="font-size:12px;font-weight:600">Password</label>
    <input type="password" id="pass-in" placeholder="••••••••">
    <button class="btn pri" id="auth-sub" style="width:100%">Continue</button>
    <p style="text-align:center;margin-top:14px;font-size:13px;color:var(--mut);cursor:pointer" id="auth-switch">Need an account? Register</p>
  </div>
</div>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const SUPABASE_URL="https://xqftxszpozrpuzhsnyho.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_IBatpScfMC8L4Ys93DQWMg_GJKLyD3B";
const supabase=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

function shoeSVG(c,f){
 const UP='M40 148 L38 66 Q40 50 62 50 L100 52 Q118 92 150 96 L165 60 L200 58 L215 92 Q330 98 372 132 Q390 146 388 150 Z';
 let laces='';for(let i=0;i<4;i++){const x=172+i*15,y=68+i*8;laces+=`<line x1="${x-12}" y1="${y+6}" x2="${x+14}" y2="${y-2}" stroke="${c[4]}" stroke-width="4" stroke-linecap="round"/>`}
 const fx=f==='glossy'?`<path d="${UP}" fill="url(#gl)"/>`:f==='glitter'?`<path d="${UP}" fill="url(#gt)"/>`:'';
 return `<svg viewBox="0 0 420 220" xmlns="http://www.w3.org/2000/svg"><defs>
 <linearGradient id="gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".6"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></linearGradient>
 <pattern id="gt" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#fff" opacity=".8"/><circle cx="6" cy="6" r=".9" fill="#fff" opacity=".5"/></pattern></defs>
 <g stroke="rgba(0,0,0,.35)" stroke-width="1.5" stroke-linejoin="round">
 <path d="M30 172 H386 Q384 192 355 192 H60 Q34 192 30 172 Z" fill="${c[6]}"/>
 <path d="M28 148 H388 V166 Q388 180 360 180 H58 Q28 180 28 162 Z" fill="${c[5]}"/>
 <path d="${UP}" fill="${c[0]}"/>
 <path d="M296 98 Q360 106 372 132 Q390 146 388 150 L300 150 Q316 124 296 98 Z" fill="${c[1]}"/>
 <path d="M38 148 L38 66 Q40 50 62 50 L82 51 Q96 100 86 148 Z" fill="${c[2]}"/>
 <path d="M96 138 C150 152 245 134 305 104 C252 124 200 118 150 108 C124 103 104 114 96 138 Z" fill="${c[3]}"/>
 <path d="M150 96 L165 60 L200 58 L215 92 Q182 102 150 96 Z" fill="${c[0]}"/>
 <path d="M150 96 L165 60 L200 58 L215 92 Q182 102 150 96 Z" fill="#000" opacity=".12"/>
 </g>${laces}${fx}</svg>`;
}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}

let me=null,coins=0,INV={},MK={},isReg=false;

document.querySelectorAll(".tab[data-v]").forEach(b=>b.onclick=()=>{
 document.querySelectorAll(".tab[data-v]").forEach(t=>t.classList.toggle("on",t===b));
 ["inv","mkt"].forEach(v=>$("#v-"+v).hidden=v!==b.dataset.v);
});

async function checkAuth(){
 const {data:{user}}=await supabase.auth.getUser();
 me=user;
 if(me){
  const {data}=await supabase.from('users').select('coins').eq('id',me.id).single();
  if(data){
   coins=data.coins;
  }else{
   await supabase.from('users').insert({id:me.id,name:me.email.split('@')[0],coins:1000});
   coins=1000;
  }
  loadData();
 }else{coins=0;INV={};MK={};}
 paint();
}

function paint(){
 $('#auth-btn').textContent=me?"Sign out":"Sign in";
 $('#coins').textContent=me?coins.toLocaleString()+" coins":"";
 const k=Object.keys(INV);
 $('#inv').innerHTML=k.map(id=>{const d=INV[id];return `<div class="card"><div class="pic">${shoeSVG(d.c,d.f)}</div><p>${d.n}</p><small>Size ${d.z} &middot; ${d.r}</small><div class="row"><button class="btn pri" data-sell="${id}">Sell</button></div></div>`}).join("");
 $('#invmsg').innerHTML=!me?"Sign in to see your shoes.":k.length?"":`Nothing in your inventory yet. <a href="https://mohamednaser2143-sudo.github.io/solex/" style="color:var(--coral)">Buy your first pair at SoleX</a>.`;
 
 const m=Object.keys(MK);
 $('#mkt').innerHTML=m.map(id=>{const d=MK[id],own=me&&d.seller===me.id;return `<div class="card"><div class="pic">${shoeSVG(d.shoe.c,d.shoe.f)}</div><p>${d.shoe.n}</p><small>Size ${d.shoe.z} &middot; ${d.price.toLocaleString()} coins &middot; ${d.sn}</small><div class="row"><button class="btn ${own?"":"pri"}" data-id="${id}" data-a="${own?"x":"b"}">${own?"Cancel":"Buy"}</button></div></div>`}).join("");
 $('#mktmsg').textContent=!me?"Sign in to see listings.":m.length?"":"No active player listings right now.";
}

async function loadData(){
 if(!me)return;
 const {data: invData}=await supabase.from('inventory').select('*').eq('user_id',me.id);
 INV={};if(invData)invData.forEach(item=>INV[item.id]=item);
 
 const {data: mktData}=await supabase.from('listings').select('*');
 MK={};if(mktData)mktData.forEach(item=>MK[item.id]=item);
 paint();
}

$('#auth-btn').onclick=async()=>{
 if(me){await supabase.auth.signOut();me=null;checkAuth();toast("Signed out");return;}
 $('#auth-ov').classList.add('on');
};
$('#auth-x').onclick=()=>$('#auth-ov').classList.remove('on');
$('#auth-switch').onclick=()=>{
 isReg=!isReg;
 $('#auth-title').textContent=isReg?"Create Account":"Sign In";
 $('#auth-sub').textContent=isReg?"Register":"Sign In";
 $('#auth-switch').textContent=isReg?"Already have an account? Sign in":"Need an account? Register";
};
$('#auth-sub').onclick=async()=>{
 const em=$('#email-in').value,pw=$('#pass-in').value;
 if(!em||!pw)return toast("Enter email and password");
 if(isReg){
  const {error}=await supabase.auth.signUp({email:em,password:pw});
  if(error)return toast(error.message);
  toast("Account created! You can now sign in.");
  isReg=false;$('#auth-title').textContent="Sign In";$('#auth-sub').textContent="Sign In";
 }else{
  const {error}=await supabase.auth.signInWithPassword({email:em,password:pw});
  if(error)return toast(error.message);
  $('#auth-ov').classList.remove('on');
  toast("Signed in successfully");
  checkAuth();
 }
};

$('#inv').onclick=async e=>{
 const id=e.target.dataset.sell;if(!id||!INV[id])return;
 const p=Math.round(+prompt("Sell for how many coins?","500"));if(!(p>0))return;
 const item=INV[id];
 await supabase.from('listings').insert({seller:me.id,sn:me.email.split('@')[0],shoe:{n:item.n,c:item.c,f:item.f,z:item.z},price:p,ts:Date.now()});
 await supabase.from('inventory').delete().eq('id',id);
 toast("Listed on the player market");
 loadData();
};

$('#mkt').onclick=async e=>{
 const b=e.target.closest("button");if(!b||!me)return;const id=b.dataset.id,L=MK[id];if(!L)return;
 if(b.dataset.a==="x"){
  await supabase.from('listings').delete().eq('id',id);
  await supabase.from('inventory').insert({user_id:me.id,n:L.shoe.n,c:L.shoe.c,f:L.shoe.f,z:L.shoe.z,r:'Epic',paid:0,ts:Date.now()});
  toast("Shoe returned to inventory");
  loadData();
  return;
 }
 if(coins<L.price)return toast("Not enough coins");
 
 const newCoins=coins-L.price;
 await supabase.from('users').update({coins:newCoins}).eq('id',me.id);
 
 const {data: sellerData}=await supabase.from('users').select('coins').eq('id',L.seller).single();
 if(sellerData){
  await supabase.from('users').update({coins:sellerData.coins+L.price}).eq('id',L.seller);
 }

 await supabase.from('inventory').insert({user_id:me.id,n:L.shoe.n,c:L.shoe.c,f:L.shoe.f,z:L.shoe.z,r:'Epic',paid:L.price,ts:Date.now()});
 await supabase.from('listings').delete().eq('id',id);

 toast("You bought "+L.shoe.n);
 checkAuth();
};

supabase.channel('public:listings')
 .on('postgres_changes',{event:'*',schema:'public',table:'listings'},()=>loadData())
 .subscribe();

checkAuth();
</script>
</body>
</html>
