<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SoleSmith - Your Sneaker Inventory</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--ink:#1b1626;--ink2:#2a2338;--paper:#efece6;--coral:#ff5a36;--line:#3a3150;--mut:#a79fba}
*{box-sizing:border-box;margin:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--ink);color:#fff;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 28px;gap:12px;flex-wrap:wrap;max-width:1250px;margin:auto}
.logo{font-family:Syne,sans-serif;font-weight:800;font-size:26px}.logo b{color:var(--coral)}
.who{display:flex;gap:12px;align-items:center;font-weight:700}
#coins{background:var(--ink2);padding:9px 16px;border-radius:99px}
.btn{padding:11px 20px;border-radius:14px;border:0;font:700 14px Inter;cursor:pointer;background:var(--line);color:#fff}
.btn.pri{background:var(--coral)}.btn:hover{filter:brightness(1.12)}
.tabs{display:flex;gap:8px;padding:0 28px 18px;max-width:1250px;margin:auto;flex-wrap:wrap}
.tab{background:transparent;border:1px solid var(--line);color:#fff;padding:10px 20px;border-radius:99px;font:700 14px Inter;cursor:pointer;text-decoration:none}
.tab.on{background:#fff;color:var(--ink)}
.view{max-width:1250px;margin:auto;padding:0 28px 60px}
.view[hidden]{display:none}
h2{font:800 26px Syne;margin-bottom:8px}
.msg{color:var(--mut);margin-bottom:14px}.msg a{color:var(--coral)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--ink2);border-radius:20px;padding:12px;border:1px solid transparent}
.card:hover{border-color:var(--coral)}
.pic{background:radial-gradient(ellipse at 50% 70%,#fff,var(--paper));border-radius:14px;padding:12px;position:relative}
.pic span{position:absolute;left:10px;top:10px;font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;color:#fff}
.card p{font-weight:700;margin:10px 4px 0}.card small{color:var(--mut);margin:0 4px;display:block;margin-top:3px}
.row{margin:12px 4px 2px}.row .btn{width:100%}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.ov.on{display:flex}
.am{background:var(--ink2);border-radius:24px;padding:28px;max-width:400px;width:100%}
.am input{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--ink);color:#fff;font:15px Inter;margin:8px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
:focus-visible{outline:3px solid #ffb400;outline-offset:2px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(90px);background:#fff;color:var(--ink);padding:12px 20px;border-radius:14px;font-weight:600;transition:transform .3s;z-index:20;max-width:90vw}
#toast.show{transform:translateX(-50%)}
@media(max-width:700px){header,.tabs,.view{padding-left:16px;padding-right:16px}}
</style>
</head>
<body>
<header>
  <div class="logo">Sole<b>Smith</b></div>
  <div class="who"><span id="coins"></span><button class="btn pri" id="auth">Sign in</button></div>
</header>
<div class="tabs">
  <button class="tab on" data-v="inv">My inventory</button>
  <button class="tab" data-v="mkt">Player market</button>
  <a class="tab" href="https://mohamednaser2143-sudo.github.io/solex/">Shop at SoleX</a>
</div>
<section class="view" id="v-inv"><h2>My inventory</h2><p class="msg" id="invmsg"></p><div class="cards" id="inv"></div></section>
<section class="view" id="v-mkt" hidden><h2>Player market</h2><p class="msg" id="mktmsg"></p><div class="cards" id="mkt"></div></section>

<div class="ov" id="am"><div class="am">
  <h2>Welcome</h2><p class="msg">Create an account and start with 1,000 coins.</p>
  <input id="em" type="email" placeholder="Email" autocomplete="email">
  <input id="pw" type="password" placeholder="Password (6+ characters)" autocomplete="current-password">
  <div class="two"><button class="btn" id="si">Sign in</button><button class="btn pri" id="su">Create account</button></div>
</div></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const SB=supabase.createClient("https://xqftxszpozrpuzhsnyho.supabase.co","sb_publishable_IBatpScfMC8L4Ys93DQWMg_GJKLyD3B");
const SOLEX="https://mohamednaser2143-sudo.github.io/solex/";
const RC={Common:'#8a8497',Rare:'#2e86ff',Epic:'#a855f7',Legendary:'#e08a00'};
const esc=t=>String(t==null?'':t).replace(/[<>&"]/g,'');
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2600)}
function shoeSVG(c,f){
 const UP='M40 148 L38 66 Q40 50 62 50 L100 52 Q118 92 150 96 L165 60 L200 58 L215 92 Q330 98 372 132 Q390 146 388 150 Z';
 let laces='';for(let i=0;i<4;i++){const x=172+i*15,y=68+i*8;laces+=`<line x1="${x-12}" y1="${y+6}" x2="${x+14}" y2="${y-2}" stroke="${c[4]}" stroke-width="4" stroke-linecap="round"/>`}
 const fx=f==='glossy'?`<path d="${UP}" fill="url(#gl)"/>`:f==='glitter'?`<path d="${UP}" fill="url(#gt)"/>`:'';
 return `<svg viewBox="0 0 420 220" style="width:100%;display:block" xmlns="http://www.w3.org/2000/svg"><defs>
 <linearGradient id="gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".6"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></linearGradient>
 <pattern id="gt" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#fff" opacity=".8"/><circle cx="6" cy="6" r=".9" fill="#fff" opacity=".5"/></pattern></defs>
 <g stroke="rgba(0,0,0,.35)" stroke-width="1.5" stroke-linejoin="round">
 <path d="M30 172 H386 Q384 192 355 192 H60 Q34 192 30 172 Z" fill="${c[6]}"/>
 <path d="M28 148 H388 V166 Q388 180 360 180 H58 Q28 180 28 162 Z" fill="${c[5]}"/>
 <path d="${UP}" fill="${c[0]}"/>
 <path d="M296 98 Q360 106 372 132 Q390 146 388 150 L300 150 Q316 124 296 98 Z" fill="${c[1]}"/>
 <path d="M38 148 L38 66 Q40 50 62 50 L82 51 Q96 100 86 148 Z" fill="${c[2]}"/>
 <path d="M96 138 C150 152 245 134 305 104 C252 124 200 118 150 108 C124 103 104 114 96 138 Z" fill="${c[3]}"/>
 <path d="M150 96 L165 60 L200 58 L215 92 Q182 102 150 96 Z" fill="${c[0]}"/>
 <path d="M150 96 L165 60 L200 58 L215 92 Q182 102 150 96 Z" fill="#000" opacity=".12"/>
 </g>${laces}${fx}</svg>`;
}
let me=null,prof=null,INV=[],MK=[];
async function load(){
 if(!me){prof=null;INV=[];MK=[];return paint()}
 const [p,i,m]=await Promise.all([
  SB.from('profiles').select('*').eq('id',me.id).single(),
  SB.from('inventory').select('*').order('id',{ascending:false}),
  SB.from('listings').select('*').order('id',{ascending:false})]);
 prof=p.data;INV=i.data||[];MK=m.data||[];paint();
}
function pic(s){return `<div class="pic"><span style="background:${RC[s.r]||RC.Common}">${esc(s.r)}</span>${shoeSVG(s.c,s.f)}</div>`}
function paint(){
 $('#auth').textContent=me?'Sign out':'Sign in';
 $('#coins').textContent=me&&prof?prof.coins.toLocaleString()+' coins':'';
 $('#inv').innerHTML=INV.map(d=>`<div class="card">${pic(d.shoe)}<p>${esc(d.shoe.n)}</p><small>Size ${esc(d.size)}${d.paid?' &middot; paid '+d.paid:''}</small><div class="row"><button class="btn pri" data-sell="${d.id}">Sell</button></div></div>`).join('');
 $('#invmsg').innerHTML=!me?'Sign in to see your shoes.':INV.length?'':`Nothing yet. <a href="${SOLEX}">Buy your first pair at SoleX</a>.`;
 $('#mkt').innerHTML=MK.map(d=>{const own=me&&d.seller===me.id;return `<div class="card">${pic(d.shoe)}<p>${esc(d.shoe.n)}</p><small>Size ${esc(d.size)} &middot; ${d.price.toLocaleString()} coins</small><small>Seller: ${esc(d.seller_name)}</small><div class="row"><button class="btn ${own?'':'pri'}" data-id="${d.id}" data-a="${own?'x':'b'}">${own?'Cancel listing':'Buy'}</button></div></div>`}).join('');
 $('#mktmsg').textContent=!me?'Sign in to see listings.':MK.length?'':'No listings yet. Sell a shoe from your inventory.';
}
async function rpc(fn,args,ok){
 const {error}=await SB.rpc(fn,args);
 if(error){toast(error.message);return}
 toast(ok);load();
}
$('#inv').onclick=e=>{const id=e.target.dataset.sell;if(!id)return;
 const p=Math.round(+prompt('Sell for how many coins?','500'));if(!(p>0))return;
 rpc('list_shoe',{p_inv:+id,p_price:p},'Listed on the player market')};
$('#mkt').onclick=e=>{const b=e.target.closest('button');if(!b)return;
 b.dataset.a==='x'?rpc('cancel_listing',{p_id:+b.dataset.id},'Back in your inventory'):rpc('buy_listing',{p_id:+b.dataset.id},'Bought! Check your inventory')};
document.querySelectorAll('.tab[data-v]').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('.tab[data-v]').forEach(t=>t.classList.toggle('on',t===b));
 ['inv','mkt'].forEach(v=>$('#v-'+v).hidden=v!==b.dataset.v);load()});
async function login(up){
 const email=$('#em').value.trim(),password=$('#pw').value;
 const r=up?await SB.auth.signUp({email,password}):await SB.auth.signInWithPassword({email,password});
 if(r.error)return toast(r.error.message);
 if(!r.data.session)return toast('Check your email to confirm, then sign in');
 $('#am').classList.remove('on');toast(up?'Welcome! You start with 1,000 coins':'Signed in');
}
$('#si').onclick=()=>login(false);$('#su').onclick=()=>login(true);
$('#am').onclick=e=>{if(e.target.id==='am')$('#am').classList.remove('on')};
$('#auth').onclick=()=>me?SB.auth.signOut():$('#am').classList.add('on');
SB.auth.onAuthStateChange((_e,s)=>{me=s?s.user:null;load()});
setInterval(()=>{if(me)load()},8000);
paint();
</script>
</body>
</html>
